  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {

  return a;
}

function fragenMitGemischtenOptionen(fragen) {
  return fragen.map(f => {
    const idxArr = f.optionen.map((_, i) => i);
    const gemischt = shuffle(idxArr);
    return {
      ...f,
      optionen: gemischt.map(i => f.optionen[i]),
      richtig: gemischt.indexOf(f.richtig)
    };
  });
}
