/* ============================================================
   SPACED REPETITION (vereinfachtes Leitner-System)
   Box 1: 1 Tag, Box 2: 3 Tage, Box 3: 7 Tage, Box 4: 16 Tage, Box 5: 35 Tage
   "Wusste ich" -> eine Box weiter (bis max. Box 5)
   "Wusste ich nicht" -> zurück auf Box 1

const LEITNER_INTERVALLE_TAGE = [1, 3, 7, 16, 35];
function berechneNaechsteFaelligkeit(box) {
  const tage = LEITNER_INTERVALLE_TAGE[Math.min(box, LEITNER_INTERVALLE_TAGE.length - 1)];
  const datum = new Date();
  datum.setDate(datum.getDate() + tage);
  return datum.toISOString();
}
